version: '3.8'

services:
  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - ORDER_SERVICE_URL=http://order-service:8002
      - PRODUCT_SERVICE_URL=http://product-service:8003
      - REDIS_URL=redis://redis:6379
    depends_on:
      - user-service
      - order-service
      - product-service
      - redis
    networks:
      - frontend
      - backend

  # User Service
  user-service:
    build: ./user-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/users
      - SERVICE_PORT=8001
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - backend
      - database

  # Order Service
  order-service:
    build: ./order-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/orders
      - SERVICE_PORT=8002
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - backend
      - database

  # Product Service
  product-service:
    build: ./product-service
    environment:
      - MONGODB_URL=mongodb://mongo:27017/products
      - SERVICE_PORT=8003
    depends_on:
      - mongo
    networks:
      - backend
      - database

  # PostgreSQL for User and Order services
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - database

  # MongoDB for Product service
  mongo:
    image: mongo:6
    volumes:
      - mongo_data:/data/db
    networks:
      - database

  # Redis for caching
  redis:
    image: redis:7-alpine
    networks:
      - backend

  # RabbitMQ for message queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - backend

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - frontend

volumes:
  postgres_data:
  mongo_data:

networks:
  frontend:
  backend:
  database:
